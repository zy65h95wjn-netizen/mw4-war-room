h1{font-size:26px;margin:0 0 3px;letter-spacing:-.035em} h2{margin:0;font-size:16px;letter-spacing:.015em}h3{margin:0;font-size:13px}p{margin:5px 0 10px} .muted{color:var(--soft)}.fine{font-size:11px;color:var(--soft)} .tiny{font-size:10px;color:#9aa8b8}.strong{font-weight:780}.gold{color:var(--orange)}.good{color:var(--green)}.bad{color:var(--red)}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:#9daebe;font-weight:850;font-size:10px}.row{display:flex;align-items:center;gap:12px}.space{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.metric{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0b131e}.metric .value{font-size:29px;line-height:1.1;font-weight:900;letter-spacing:-.05em}.metric .label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--soft);margin-bottom:5px}.metric .hint{font-size:11px;color:#a6b3be;margin-top:5px}
.sectionhead{margin:19px 2px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionhead h2{font-size:17px}.badge{display:inline-block;padding:4px 8px;font-size:10px;border-radius:6px;border:1px solid #536478;color:#b8cbd5;font-weight:750}.badge.gold{border-color:#826039;background:#4b321825;color:#ffca85}.badge.green{color:#99e2b7;border-color:#315645;background:#24573b20}.badge.red{color:#ffc0b6;border-color:#683938;background:#67252024}.divider{height:1px;background:var(--line);margin:15px 0}.bar{height:7px;border-radius:9px;background:#26313f;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#9f672f,#ffbd61);border-radius:9px;transition:width .2s}
.btn{padding:11px 14px;border:1px solid #415269;border-radius:10px;font-weight:750;background:#202d3b;color:#e7eef7;text-align:center}.btn.primary{background:linear-gradient(110deg,#f4a63e,#db8b31);color:#161412;border-color:#e7ad5b}.btn.minor{padding:8px 10px;font-size:12px}.btn.outline{background:#101923}.btn.danger{background:#351a21;border-color:#873e45;color:#ffb4ae}.btn:active{transform:translateY(1px)}.btnrow{display:flex;flex-wrap:wrap;gap:7px}.label{display:block;font-weight:700;font-size:12px;color:#c9d3db;margin:0 0 6px}.field{display:block;margin-bottom:12px}.iconbtn{padding:8px 11px;background:#1c2b39;border-radius:9px;color:#ffc57d;font-weight:850}

.weaponrow{display:grid;grid-template-columns:minmax(0,1fr) 78px 34px;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #273545}.weaponrow:last-child{border:0}.weaponname{font-weight:780}.weaponrow small{display:block;color:var(--soft);font-size:11px}.weaponrow input{text-align:center;padding:8px 5px;font-weight:800}.weaponrow .pin{padding:9px 7px;border-radius:8px;border:1px solid #4b5d6f}.weaponrow .pin.active{color:var(--orange);border-color:#c48d4b;background:#c081331b}.filterrow{display:flex;overflow:auto;gap:6px;scrollbar-width:none;margin:10px 0}.filterrow button{border:1px solid #3a4a5c;border-radius:100px;padding:6px 11px;color:#aec0cf;white-space:nowrap;font-size:12px}.filterrow button.active{background:#f9b55b;color:#151718;border-color:#f9b55b;font-weight:800}
.compare{border-left:3px solid #dba24b;padding:11px 12px;background:#d29a3712;border-radius:0 11px 11px 0;margin-bottom:8px}.listitem{padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.loadfield{display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px;align-items:center;margin-bottom:10px}.loadfield .label{margin:0}.callprogress{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tier{border-radius:7px;padding:7px 10px;border:1px solid #4c6070;color:#9daebd;font-size:11px;font-weight:800}.tier.earned{background:#b97d3344;border-color:#d29b4b;color:#f7c787}.empty{border:1px dashed #425266;border-radius:12px;padding:18px;color:var(--soft);font-size:13px;text-align:center}.links{display:flex;gap:9px;flex-wrap:wrap}.links a{font-size:12px}.notice{padding:11px 12px;border-radius:9px;background:#a2763424;border:1px solid #74552e;font-size:12px;color:#f0d2a5}
#toast{position:fixed;z-index:20;top:calc(var(--top) + 10px);left:50%;transform:translateX(-50%);background:#243a34;color:#b7f6d2;border:1px solid #3e8264;max-width:90vw;border-radius:10px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s}#toast.show{opacity:1}
@media(min-width:720px){.app{padding-inline:28px}.desktop2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.desktop2 .card{margin:0}.nav-inner{max-width:700px}.hero{min-height:225px}}
@media(max-width:390px){.nav button{font-size:8px}.app{padding-inline:12px}.loadfield{grid-template-columns:92px 1fr}.brandname{font-size:18px}}

<body>
<div class="app"><header class="top"><div class="brand"><div class="mark" aria-hidden="true">⌖</div><div><div class="kicker">MW4 / Personal Command</div><div class="brandname">WAR ROOM</div><div class="subline">YOUR PROGRESSION. YOUR PLAYSTYLE.</div></div></div><div class="chip">PROTOTYPE 0.1</div></header><main id="main" aria-live="polite"></main></div>
<nav class="nav" aria-label="War Room navigation"><div id="nav" class="nav-inner"></div></nav><div id="toast" role="status" aria-live="polite"></div><input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const OFFICIAL_WEAPONS = 'https://www.callofduty.com/ca/en/blog/2026/10/call-of-duty-modern-warfare-4-launch-multiplayer-operators-weapons-equipment-create-a-class';
const OFFICIAL_PROGRESSION = 'https://www.callofduty.com/au/en/blog/2026/10/call-of-duty-modern-warfare-4-ready-for-launch-progression-prestige';
const OFFICIAL_PATCH = 'https://www.callofduty.com/patchnotes/2026/10/call-of-duty-modern-warfare-4-launch-patch-notes';
const STATS_URL = 'https://wzstats.gg/mw4/meta';
const COD_URL = 'https://codmunity.gg/mw4';
const SOURCE_DATE = '2026-10-27';
// Weapon player-level unlocks use Activision's dedicated Level 1–55 progression table,
// rather than sometimes conflicting inline weapon descriptions. Confirm against the game.
const W=[
['han','HAN 86','AR',4,72],['m4','M4','AR',14,72],['hyeon','Hyeon Burst','AR',21,68],['patriot','Patriot XMR','AR',27,72],['kastov','Kastov 762','AR',34,68],['oden','Oden','AR',39,65],['axion','Axion','AR',52,69],['cronen','Cronen Squall','AR',55,67],
['iso','ISO Nightshade','SMG',4,64],['vel','VEL 46','SMG',5,60],['striga','Wz.55 Striga','SMG',18,60],['ppsh','PPSh-41','SMG',30,62],['nyx','X-58 Nyx','SMG',46,53],
['rezi','Rezi 12','Shotgun',4,60],['warlord','Warlord','Shotgun',32,60],
['finn','FiNN LMG','LMG',4,59],['type73','Type 73','LMG',9,65],['apoc','APOC-338','LMG',44,56],
['mar','MAR-9','Marksman',4,73],['oris','Oris 8.6','Marksman',11,70],['mosin','Mosin-Nagant','Marksman',36,69],
['kg7','KG-7 Vulcan','Sniper',4,75],['astaroth','Astaroth .57','Sniper',25,54],['signal','Signal 50','Sniper',50,74],
['sang','SANG 9mm','Pistol',4,38],['krait','Krait P68','Pistol',7,38],['gs',' .50 GS','Pistol',41,37],['mojave','Mojave .357','Pistol',48,44],
['pila','PILA','Launcher',4,46],['rpg','RPG-8','Launcher',23,46],['jokr','JOKR','Launcher',43,46],['anvil','PM-40 Anvil','Launcher',54,46],
['knife','FSS Carbon Edge 1095','Melee',4,46]
].map(([id,name,group,unlock,max])=>({id,name:name.trim(),group,unlock,max}));
const GROUPS=['All','AR','SMG','Shotgun','LMG','Marksman','Sniper','Pistol','Launcher','Melee'];
const META={wz:[{id:'axion',text:'#1 AR • Axion'},{id:'iso',text:'#1 SMG • ISO Nightshade'},{id:'han',text:'#2 AR • HAN 86'},{id:'m4',text:'#3 AR • M4'},{id:'vel',text:'#2 SMG • VEL 46'},{id:'kastov',text:'#4 AR • Kastov 762'}],cod:[{id:'han',text:'Absolute Meta • HAN 86'},{id:'vel',text:'Absolute Meta • VEL 46'},{id:'kg7',text:'Absolute Meta • KG-7 Vulcan'},{id:'hyeon',text:'Absolute Meta • Hyeon Burst'},{id:'iso',text:'Absolute Meta • ISO Nightshade'}]};
const ccCategories=['Multiplayer • Objective','Multiplayer • War','Multiplayer • Capture Zone','Multiplayer • Bomb','Multiplayer • Cash','Multiplayer • Dog Tag','DMZ • Combat','DMZ • Mission','DMZ • Exfil','DMZ • Loot','DMZ • Exploration','DMZ • FOB','Shared • Combat','Shared • Loadout','Shared • Collection','Shared • Mobility Course','Elite Multiplayer','Elite DMZ','Elite Campaign','Other'];
const KEYS={profile:'profile',weapons:'weapons',loadouts:'loadouts',calling:'calling',stats:'stats',events:'events',bp:'bp',settings:'settings'};
function fresh(){return {schema:1,profile:{rank:null,prestige:null,activeWeapon:'han'},weapons:{han:38},loadouts:[{id:'han-starter',name:'HAN 86 — Iron Sights',primary:'han',secondary:'sang',optic:false,slots:{Muzzle:'FTAC Dominion',Underbarrel:'FSS Fireline Grip','Rear Grip':'XRK Justice II Grip',Stock:'FR4 Retractable Stock',Laser:'XRK Clutch-LS'},notes:'Previously discussed level-38 suggestion. Attachment names and unlocks are NOT yet verified in your in-game Gunsmith.'}],calling:[{id:'victorious',name:'Victorious!',category:'Multiplayer • Objective',current:0,target:300,official:true}],stats:{kills:null,deaths:null,wins:null,losses:null,spm:null,hours:null},events:[],bp:{season:'Season 1',total:null,level:0,notes:''},settings:{meta:'wz',selectedLoadout:'han-starter'}}}
const storeKey='mw4-warroom-v01'; let data=fresh();let persistOK=true;
try{const raw=localStorage.getItem(storeKey);if(raw){const parsed=JSON.parse(raw); if(parsed&&parsed.schema===1){const base=fresh();data={...base,...parsed,profile:{...base.profile,...parsed.profile},weapons:{...base.weapons,...parsed.weapons},stats:{...base.stats,...parsed.stats},bp:{...base.bp,...parsed.bp},settings:{...base.settings,...parsed.settings}}}}}catch(e){persistOK=false}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(data));persistOK=true}catch(e){persistOK=false;notice('Browser storage unavailable. Export your data to preserve it.')}}
let view='home',weaponGroup='All',weaponSearch='',metaSource=data.settings.meta||'wz';
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const weapon=id=>W.find(w=>w.id===id)||W[0];const level=id=>Math.max(0,Math.min(9999,Number(data.weapons[id])||0));
const rank=()=>data.profile.rank===null||data.profile.rank===''?null:Number(data.profile.rank);
const pct=(a,b)=>b>0?Math.min(100,Math.max(0,Math.round(a/b*100))):0;
const num=v=>v===null||v===''?'—':Number(v).toLocaleString('en-US');
const badge=(text,variant='')=>`<span class="badge ${variant}">${esc(text)}</span>`;
const prog=(n,max)=>`<div class="bar" role="progressbar" aria-valuenow="${Math.min(n,max)}" aria-valuemin="0" aria-valuemax="${max}"><span style="width:${pct(n,max)}%"></span></div>`;
const link=(url,text)=>`<a target="_blank" rel="noopener noreferrer" href="${esc(url)}">${esc(text)} ↗</a>`;
function notice(msg){const t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function navigate(to){view=to;window.scrollTo({top:0,behavior:'instant'});render()}
function nav(){const items=[['home','⌂','Home'],['arsenal','▥','Arsenal'],['loadouts','⌖','Classes'],['meta','◈','Meta'],['ops','◉','Ops'],['profile','▤','Stats']];el('nav').innerHTML=items.map(([id,icon,label])=>`<button data-view="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}><b>${icon}</b><span>${label}</span></button>`).join('')}
function heading(title,subtitle=''){return `<div style="margin-bottom:17px"><h1>${esc(title)}</h1>${subtitle?`<p class="muted" style="margin:4px 0">${esc(subtitle)}</p>`:''}</div>`}
function dashboard(){const r=rank();const a=weapon(data.profile.activeWeapon),l=level(a.id),lo=data.loadouts.find(x=>x.id===data.settings.selectedLoadout)||data.loadouts[0];const remain=r==null?'Enter player rank':r>=52?'Rank 52 reached':`${52-r} rank${52-r===1?'':'s'} to Axion`;const tracked=data.calling.filter(c=>c.target>0).length;
return `<div class="hero card"><span class="pill">OPERATOR DASHBOARD</span><div class="eyebrow">ACTIVE PRIMARY</div><div class="big">${esc(a.name.toUpperCase())}</div><p>Iron sights by default. Your gear, your progress, no noise.</p><div class="row">${badge('WEAPON LV '+l,'gold')}${badge('PLAYER LV '+(r??'?'))}</div></div>
<div class="grid2"><div class="metric"><div class="label">Player Rank</div><div class="value">${r??'—'}</div><div class="hint">Prestige ${num(data.profile.prestige)}</div></div><div class="metric"><div class="label">Active Weapon</div><div class="value">${l}<span class="muted" style="font-size:15px;font-weight:500"> / ${a.max}</span></div>${prog(l,a.max)}<div class="hint">${pct(l,a.max)}% of weapon levels</div></div></div>
<div class="sectionhead"><h2>Next targets</h2></div><div class="card"><div class="space"><div><div class="eyebrow">Unlock target</div><h2 style="margin-top:6px">AXION • Rank 52</h2><p class="muted" style="font-size:12px">${esc(remain)}</p></div><span style="font-size:30px;color:var(--orange)">◎</span></div>${r!==null?prog(r,52):''}<div class="divider"></div><div class="eyebrow">Current HAN suggestion</div><p style="margin-top:7px">Test the level-46 laser upgrade when Gunsmith confirms it's available.</p><div class="fine">Unverified attachment advice from our prior conversation, not a confirmed unlock.</div><div class="btnrow" style="margin-top:13px"><button data-view="arsenal" class="btn minor">Update levels</button><button data-view="loadouts" class="btn minor">My class</button></div></div>
<div class="desktop2"><div class="card"><div class="space"><h2>Loadout</h2>${badge('PERSONAL')}</div><div style="font-weight:850;font-size:20px;margin:12px 0 3px">${esc(lo?.name||'New class')}</div><p class="muted">${esc(weapon(lo?.primary).name)} + ${esc(weapon(lo?.secondary).name)}</p><div class="fine">${lo?.optic?'Optic selected':'Iron sights selected'} • Editable attachment slots</div></div><div class="card"><div class="space"><h2>Progress</h2>${badge('LOCAL')}</div><div class="grid2" style="margin-top:13px"><div><div class="label">Tracked cards</div><div class="value" style="font-size:25px;font-weight:850">${tracked}</div></div><div><div class="label">Weapon records</div><div class="value" style="font-size:25px;font-weight:850">${Object.keys(data.weapons).filter(k=>level(k)>0).length}/33</div></div></div><button data-view="ops" class="btn minor outline" style="margin-top:13px">Calling cards & events</button></div></div>
<div class="sectionhead"><h2>Meta radar</h2>${badge('SNAPSHOT 27 OCT','gold')}</div><div class="card"><div class="space"><div><div class="eyebrow">WZStats • Assault rifles</div><h2 style="margin-top:5px">Axion #1 / HAN 86 #2</h2></div><span class="gold" style="font-size:28px">↗</span></div><p class="fine">CODMunity currently ranks the HAN as an Absolute Meta pick. Different methods, different winners.</p><div class="links">${link(STATS_URL,'WZStats')}${link(COD_URL,'CODMunity')}</div></div>`}
function arsenal(){const r=rank(),weps=W.filter(w=>(weaponGroup==='All'||w.group===weaponGroup)&&w.name.toLowerCase().includes(weaponSearch.toLowerCase()));return `${heading('Weapon locker','Official 33-weapon launch roster. Your weapon levels save on this phone.')}
<div class="card"><div class="grid2"><label class="field"><span class="label">Multiplayer rank (1–55)</span><input data-bind="rank" type="number" min="1" max="55" placeholder="Enter rank" value="${r??''}"></label><label class="field"><span class="label">Prestige (if known)</span><input data-bind="prestige" type="number" min="0" max="1000" placeholder="Enter Prestige" value="${data.profile.prestige??''}"></label></div><p class="fine">The rank is your current 1–55 level. In-game unlocks and permanent Prestige unlocks override published rank requirements.</p></div>
<div class="card"><div class="space"><h2>Arsenal</h2>${badge('33 WEAPONS')}</div><input id="weaponSearch" type="search" placeholder="Search weapons..." value="${esc(weaponSearch)}" style="margin-top:13px"><div class="filterrow">${GROUPS.map(g=>`<button data-group="${esc(g)}" class="${weaponGroup===g?'active':''}">${esc(g)}</button>`).join('')}</div><div class="tiny">Weapon level • tap the star to set your active gun</div><div id="weaponRows">${rows(weps,r)}</div></div><div class="notice">Unlock levels follow Activision's rank table, which contradicts some descriptions on the same official page. Your Gunsmith is the deciding source. ${link(OFFICIAL_WEAPONS,'Source')}</div>`}
function rows(weps,r){return weps.length?weps.map(w=>`<div class="weaponrow"><div><div class="weaponname">${esc(w.name)} ${data.profile.activeWeapon===w.id?'★':''}</div><small>${esc(w.group)} • Rank ${w.unlock} ${r===null?'(rank unknown)':r>=w.unlock?'✓':'(locked by rank)'} • Max weapon lv ${w.max}</small>${level(w.id)?prog(level(w.id),w.max):''}</div><label title="${esc(w.name)} weapon level"><input type="number" inputmode="numeric" min="0" max="${w.max}" data-level="${w.id}" value="${level(w.id)}" aria-label="${esc(w.name)} weapon level"></label><button data-pin="${w.id}" class="pin ${data.profile.activeWeapon===w.id?'active':''}" aria-label="Set ${esc(w.name)} as active weapon" title="Set active weapon">★</button></div>`).join(''):'<p class="empty">No weapons match the filter.</p>'}
const SLOTS=['Muzzle','Barrel','Underbarrel','Magazine','Rear Grip','Stock','Laser','Ammunition','Trigger Action','Bolt','Comb','Guard','Cylinder','Fire Mods'];
function loadouts(){const selected=data.loadouts.find(l=>l.id===data.settings.selectedLoadout)||data.loadouts[0];if(!selected)return heading('Loadouts')+`<div class="empty">No saved classes. <button class="btn primary" data-action="add-loadout">Make a class</button></div>`;
return `${heading('Your loadouts','Save actual equipped attachments, not just a generic max-level meta build.')}
<div class="card"><div class="row"><label class="field" style="flex:1;margin:0"><span class="label">Saved class</span><select data-bind="selectedLoadout">${data.loadouts.map(l=>`<option value="${esc(l.id)}" ${l.id===selected.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label><button class="btn" data-action="add-loadout" style="align-self:end">+ New</button></div><div class="divider"></div><label class="field"><span class="label">Class name</span><input data-lo="name" value="${esc(selected.name)}"></label><div class="grid2"><label class="field"><span class="label">Primary</span><select data-lo="primary">${W.filter(w=>!['Pistol','Launcher','Melee'].includes(w.group)).map(w=>`<option value="${w.id}" ${selected.primary===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label><label class="field"><span class="label">Secondary</span><select data-lo="secondary">${W.filter(w=>['Pistol','Launcher','Melee'].includes(w.group)).map(w=>`<option value="${w.id}" ${selected.secondary===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label></div><label class="row" style="padding:7px 0 15px"><input type="checkbox" data-lo="optic" ${selected.optic?'checked':''}><span><strong>Equipped an optic</strong><br><small class="muted">Unchecked = iron sights</small></span></label><div class="space"><h2>Attachments</h2>${badge('EDITABLE','gold')}</div><p class="fine">Type what you actually equip. Slots left blank are unused. This version doesn't validate cross-weapon attachment compatibility.</p>${SLOTS.map(s=>`<label class="loadfield"><span class="label">${esc(s)}</span><input placeholder="Empty" data-slot="${esc(s)}" value="${esc(selected.slots?.[s]||'')}"></label>`).join('')}<label class="field"><span class="label">Build notes</span><textarea data-lo="notes">${esc(selected.notes||'')}</textarea></label><div class="btnrow"><button data-action="copy-loadout" class="btn primary">Copy build</button><button data-action="delete-loadout" class="btn danger">Delete class</button></div></div>`}
function meta(){return `${heading('Meta watch','Dated publisher snapshots; these are not live embedded feeds.')}
<div class="card"><div class="space"><h2>Source</h2>${badge('27 OCT 2026','gold')}</div><div class="filterrow"><button data-metasource="wz" class="${metaSource==='wz'?'active':''}">WZStats</button><button data-metasource="cod" class="${metaSource==='cod'?'active':''}">CODMunity</button></div><p class="fine">${metaSource==='wz'?'Ranking positions below are within weapon categories, not global ranks.':'Publisher-listed Absolute Meta picks, not ordered global rankings.'}</p>${META[metaSource].map((m,i)=>{const w=weapon(m.id);return `<div class="listitem space"><div><div style="font-weight:750">${esc(m.text)}</div><div class="tiny">${esc(w.group)} • Rank unlock ${w.unlock} • Your weapon lv ${level(w.id)}</div></div><button data-pin="${w.id}" class="iconbtn" title="Set as active">★</button></div>`}).join('')}<div class="divider"></div><div class="links">${link(metaSource==='wz'?STATS_URL:COD_URL,'Open live publisher page')}${link(metaSource==='wz'?COD_URL:STATS_URL,'Compare other source')}</div></div>
<div class="card ghost"><h2>Meta disagreement is useful</h2><p class="muted">As of Oct 27, WZStats puts Axion ahead of HAN 86 among ARs, while CODMunity places HAN 86 among its Absolute Meta choices.</p><p class="fine">We won't quietly combine conflicting rankings or call this page live. We can later add a verified refresh mechanism.</p></div>`}
function callingView(){let earned=0,goal=0;for(const c of data.calling){if(c.target>0){earned+=Math.min(Number(c.current)||0,c.target);goal+=c.target;}}return `<div class="card"><div class="space"><div><h2>Calling card tracker</h2><p class="fine">${data.calling.length} saved challenges • ${goal?pct(earned,goal):0}% cumulative goal progress</p></div>${badge('MANUAL')}</div><div class="divider"></div>${data.calling.map(c=>{const n=Math.max(0,Number(c.current)||0),t=Math.max(1,Number(c.target)||1);return `<div class="listitem"><div class="space"><div><strong>${esc(c.name)}</strong><div class="fine">${esc(c.category)} ${c.official?'• official example':''}</div></div><button class="btn minor danger" data-remove-card="${esc(c.id)}">Remove</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><label><span class="label">Current</span><input type="number" inputmode="numeric" min="0" max="${t}" data-cardnum="${esc(c.id)}" value="${n}"></label><label><span class="label">Goal</span><input type="number" inputmode="numeric" min="1" max="10000000" data-cardgoal="${esc(c.id)}" value="${t}" ${c.official?'disabled title="Official target"':''}></label></div><div style="margin:10px 0 5px">${prog(n,t)}</div>${c.id==='victorious'?`<div class="callprogress">${[20,60,150,300].map(v=>`<span class="tier ${n>=v?'earned':''}">${n>=v?'✓ ':''}${v} wins</span>`).join('')}</div>`:''}</div>`}).join('')}
<div class="divider"></div><h3>Add challenge</h3><div style="margin-top:10px"><label class="field"><span class="label">Calling card / challenge name</span><input id="cardName" maxlength="80" placeholder="e.g., Favorite calling card"></label><label class="field"><span class="label">Category</span><select id="cardCategory">${ccCategories.map(cat=>`<option>${esc(cat)}</option>`).join('')}</select></label><label class="field"><span class="label">Target number</span><input type="number" id="cardGoal" min="1" max="10000000" value="1"></label><button class="btn primary" data-action="add-card">+ Add tracker</button></div><p class="fine" style="margin-top:10px">We preloaded only Activision's verified Victorious! challenge. Add others as you encounter them; no invented requirements.</p></div>`}
function eventsView(){return `<div class="card"><div class="space"><h2>Events</h2>${badge('LAUNCH ACTIVE','gold')}</div><div class="compare" style="margin-top:13px"><b>Launch-day Event</b><p class="fine">Activision confirms an event began Oct 23, 2026. Exact reward track is not verified here, so we won't invent it.</p>${link(OFFICIAL_PATCH,'Official event notes')}</div>${data.events.length?data.events.map(ev=>`<div class="listitem"><div class="space"><strong>${esc(ev.name)}</strong><button class="btn minor danger" data-remove-event="${esc(ev.id)}">Remove</button></div><p class="fine">${esc(ev.notes||'Your custom event')}</p><label class="row"><input type="checkbox" data-eventdone="${esc(ev.id)}" ${ev.done?'checked':''}><span>${ev.done?'Completed':'Mark complete'}</span></label></div>`).join(''):'<p class="muted">No personal event checklist entries yet.</p>'}<div class="divider"></div><label class="field"><span class="label">Add event or reward to track</span><input id="eventName" maxlength="100" placeholder="Event / reward name"></label><label class="field"><span class="label">Notes / deadline</span><input id="eventNotes" maxlength="160" placeholder="Optional"></label><button data-action="add-event" class="btn primary">+ Track event</button></div>`}
function battleView(){const b=data.bp;return `<div class="card"><div class="space"><h2>Battle Pass</h2>${badge('PRE-SEASON')}</div><p class="muted">Season 1's Battle Pass is not live as of Oct 27, 2026. Individual rewards haven't been loaded.</p><div class="notice">The official store page confirms a Season 1 Battle Pass and BlackCell offering. We'll only load individual rewards once verified.</div><div class="divider"></div><div class="grid2"><label class="field"><span class="label">Tiers completed</span><input type="number" data-bp="level" min="0" max="10000" value="${b.level??0}"></label><label class="field"><span class="label">Total tiers</span><input type="number" data-bp="total" min="1" max="10000" placeholder="Pending" value="${b.total??''}"></label></div>${b.total?prog(b.level,b.total):''}<label class="field"><span class="label">Rewards to chase (notes)</span><textarea data-bp="notes" placeholder="Add rewards when the pass is revealed">${esc(b.notes||'')}</textarea></label>${link('https://support.activision.com/modern-warfare-4/articles/modern-warfare-4-editions','Official Battle Pass information')}</div>`}
function ops(){return `${heading('Operations','Calling cards, launch events, and the upcoming Battle Pass.')}<div class="sectionhead"><h2>Calling cards</h2></div>${callingView()}<div class="sectionhead"><h2>Event board</h2></div>${eventsView()}<div class="sectionhead"><h2>Season rewards</h2></div>${battleView()}`}
function profile(){const s=data.stats;let kd=(s.kills!=null&&s.deaths!=null)?(Number(s.deaths)>0?(Number(s.kills)/Number(s.deaths)).toFixed(2):(Number(s.kills)>0?'∞':'—')):'—';let wl=(s.wins!=null&&s.losses!=null)?(Number(s.losses)>0?(Number(s.wins)/Number(s.losses)).toFixed(2):(Number(s.wins)>0?'∞':'—')):'—';return `${heading('Career stats','Manually entered multiplayer totals. Nothing is automatically pulled from Activision.')}
<div class="grid2"><div class="metric"><div class="label">K / D</div><div class="value">${kd}</div><div class="hint">${num(s.kills)} kills • ${num(s.deaths)} deaths</div></div><div class="metric"><div class="label">W / L</div><div class="value">${wl}</div><div class="hint">${num(s.wins)} wins • ${num(s.losses)} losses</div></div></div>
<div class="sectionhead"><h2>Update your record</h2></div><div class="card"><div class="grid2">${[['kills','Kills'],['deaths','Deaths'],['wins','Wins'],['losses','Losses'],['spm','Score / min'],['hours','Play hours']].map(([key,label])=>`<label class="field"><span class="label">${label}</span><input type="number" min="0" step="${key==='hours'||key==='spm'?'0.1':'1'}" data-stat="${key}" value="${s[key]??''}" placeholder="Not entered"></label>`).join('')}</div><div class="fine">Numbers are not estimates. Blank means you haven't entered the stat.</div></div>
<div class="sectionhead"><h2>App data & backup</h2></div><div class="card"><div class="notice">Your data is stored only in this browser / Home Screen app. Clearing site data or deleting the app may erase it. Export a backup regularly.</div><div class="btnrow" style="margin-top:15px"><button class="btn primary" data-action="export">Export backup</button><button class="btn outline" data-action="import">Import backup</button><button class="btn danger" data-action="reset">Reset data</button></div><p class="fine" style="margin-top:12px">No account access, subscription, analytics, or external sync. ${persistOK?'Local browser storage available.':'Storage unavailable; export your data now.'}</p></div>
<div class="sectionhead"><h2>Sources & limitations</h2></div><div class="card"><div class="stack">${link(OFFICIAL_WEAPONS,'Activision • 33 launch weapons & levels')}${link(OFFICIAL_PROGRESSION,'Activision • Calling cards and progression')}${link(OFFICIAL_PATCH,'Activision • Patch notes and events')}${link(STATS_URL,'WZStats • Meta rankings')}${link(COD_URL,'CODMunity • Meta builds')}</div><p class="fine" style="margin-top:12px">Data researched Oct 27, 2026. Some official inline weapon unlock claims contradict the dedicated progression table, and one table has a likely level typo. Treat all published unlocks as provisional until checked in Gunsmith. This is an independent personal prototype, not affiliated with Activision.</p></div>`}
function render(){nav();el('main').innerHTML=({home:dashboard,arsenal,loadouts,meta,ops,profile}[view]||dashboard)();const main=el('main'); if(view==='arsenal'){const field=el('weaponSearch');field?.addEventListener('input',e=>{weaponSearch=e.target.value;el('weaponRows').innerHTML=rows(W.filter(w=>(weaponGroup==='All'||w.group===weaponGroup)&&w.name.toLowerCase().includes(weaponSearch.toLowerCase())),rank())})}}
const numeric=(raw,min,max)=>raw===''?null:Math.min(max,Math.max(min,Number(raw)||0));
function currentLoadout(){return data.loadouts.find(l=>l.id===data.settings.selectedLoadout)||data.loadouts[0]}
document.addEventListener('click',ev=>{
const btn=ev.target.closest('button');if(!btn)return;
if(btn.dataset.view){navigate(btn.dataset.view);return}
if(btn.dataset.group){weaponGroup=btn.dataset.group;render();return}
if(btn.dataset.metasource){metaSource=data.settings.meta=btn.dataset.metasource;save();render();return}
if(btn.dataset.pin){data.profile.activeWeapon=btn.dataset.pin;save();notice(`${weapon(btn.dataset.pin).name} is now active`);render();return}
if(btn.dataset.removeCard){if(!confirm('Remove this calling-card tracker?'))return;data.calling=data.calling.filter(c=>c.id!==btn.dataset.removeCard);save();render();return}
if(btn.dataset.removeEvent){if(!confirm('Remove this event checklist entry?'))return;data.events=data.events.filter(e=>e.id!==btn.dataset.removeEvent);save();render();return}
switch(btn.dataset.action){
case 'add-loadout':{const id='class-'+Date.now();const active=data.profile.activeWeapon;data.loadouts.push({id,name:'New Class',primary:active,secondary:'sang',optic:false,slots:{},notes:''});data.settings.selectedLoadout=id;save();render();notice('New class created');break}
case 'delete-loadout':{if(!confirm('Delete this loadout?'))return;const id=currentLoadout()?.id;data.loadouts=data.loadouts.filter(l=>l.id!==id);data.settings.selectedLoadout=data.loadouts[0]?.id||'';save();render();break}
case 'copy-loadout':{const l=currentLoadout();if(!l)return;const out=[l.name,`Primary: ${weapon(l.primary).name}`,`Secondary: ${weapon(l.secondary).name}`,`Optic: ${l.optic?'Yes':'No — iron sights'}`,...SLOTS.filter(s=>l.slots?.[s]).map(s=>`${s}: ${l.slots[s]}`),l.notes?`Notes: ${l.notes}`:''].filter(Boolean).join('\n');navigator.clipboard?.writeText(out).then(()=>notice('Build copied')).catch(()=>notice('Copy unavailable in this browser'));break}
case 'add-card':{const name=el('cardName')?.value.trim(),target=numeric(el('cardGoal')?.value,1,10000000);if(!name||!target){notice('Enter a name and target');return}data.calling.push({id:'card-'+Date.now(),name,category:el('cardCategory')?.value||'Other',current:0,target});save();render();notice('Calling card added');break}
case 'add-event':{const name=el('eventName')?.value.trim();if(!name){notice('Enter an event or reward name');return}data.events.push({id:'event-'+Date.now(),name,notes:el('eventNotes')?.value.trim()||'',done:false});save();render();notice('Event added');break}
case 'export':{const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mw4-war-room-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notice('Backup file prepared');break}
case 'import':el('importFile').click();break;
case 'reset':{if(!confirm('Reset ALL your locally saved War Room data? Export a backup first.'))return;data=fresh();save();render();notice('Local data reset');break}
}});
document.addEventListener('change',ev=>{const t=ev.target;if(!t.dataset)return;
if(t.dataset.bind==='rank'){data.profile.rank=numeric(t.value,1,55);save();render();return}
if(t.dataset.bind==='prestige'){data.profile.prestige=numeric(t.value,0,1000);save();render();return}
if(t.dataset.level){const w=weapon(t.dataset.level);data.weapons[w.id]=numeric(t.value,0,w.max)||0;save();render();return}
if(t.dataset.bind==='selectedLoadout'){data.settings.selectedLoadout=t.value;save();render();return}
if(t.dataset.lo){const l=currentLoadout();if(!l)return;l[t.dataset.lo]=t.dataset.lo==='optic'?t.checked:t.value;save();render();return}
if(t.dataset.slot){const l=currentLoadout();if(!l)return;l.slots??={};l.slots[t.dataset.slot]=t.value.trim();save();return}
if(t.dataset.cardnum){const c=data.calling.find(x=>x.id===t.dataset.cardnum);if(c)c.current=numeric(t.value,0,c.target)||0;save();render();return}
if(t.dataset.cardgoal){const c=data.calling.find(x=>x.id===t.dataset.cardgoal);if(c&&!c.official)c.target=numeric(t.value,1,10000000)||1;save();render();return}
if(t.dataset.eventdone){const e=data.events.find(x=>x.id===t.dataset.eventdone);if(e)e.done=t.checked;save();render();return}
if(t.dataset.bp&&t.dataset.bp!=='notes'){data.bp[t.dataset.bp]=numeric(t.value,t.dataset.bp==='total'?1:0,10000);save();render();return}
if(t.dataset.stat){data.stats[t.dataset.stat]=numeric(t.value,0,100000000);save();render();return}
});
document.addEventListener('focusout',ev=>{const t=ev.target;if(t.dataset?.lo==='notes'){const l=currentLoadout();if(l){l.notes=t.value;save()}}if(t.dataset?.bp==='notes'){data.bp.notes=t.value;save()}});
el('importFile').addEventListener('change',async ev=>{const file=ev.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj?.schema!==1||!obj?.profile||!obj?.weapons||!Array.isArray(obj.loadouts)||!Array.isArray(obj.calling)||!Array.isArray(obj.events)){throw new Error('Unrecognized backup structure')}if(!confirm('Replace current local progress with this backup?'))return;data={...fresh(),...obj};if(!data.settings||!data.stats||!data.bp)throw new Error('Incomplete backup');save();render();notice('Backup imported')}catch(e){notice('Could not import: invalid backup file')}finally{ev.target.value=''}});
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
