/* War Room briefing: purposeful intel above the fold, not a marketing hero. */
.brief-mast{position:relative;isolation:isolate;overflow:hidden;border:1px solid #405668;border-radius:15px;padding:15px 18px 17px;margin-bottom:18px;background:linear-gradient(108deg,#192d3b,#111e2b 67%,#18232b);box-shadow:0 12px 30px #0003}
.brief-mast::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:0 4px 4px 0;background:var(--amber);box-shadow:0 0 22px #f4af5160}
.brief-mast::after{content:"";z-index:-1;position:absolute;width:175px;height:175px;right:-55px;top:-93px;border:1px solid #c38a4334;border-radius:50%;box-shadow:0 0 0 26px #a6792209,0 0 0 58px #a6792207;pointer-events:none}
.brief-mast__top,.brief-mast__body,.leader-card__top,.leader-card__bottom,.intel-signal__bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brief-mast__top{color:var(--amber);font-size:9px;font-weight:900;letter-spacing:.17em}
.brief-mast__label{display:inline-flex;align-items:center;gap:9px}
.brief-signal{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--amber);box-shadow:0 0 12px #f4af5175}
.brief-mast__mode{font-size:9px;color:#b3c2d0;letter-spacing:.14em}
.brief-mast__body{align-items:flex-end;margin-top:12px}
.brief-mast__identity{min-width:0}.brief-mast h1{font-size:clamp(23px,4vw,28px);letter-spacing:-.025em;line-height:1;font-weight:950}
.brief-mast__slash{font-weight:400;color:#eda64f}
.brief-mast__identity p{margin-top:7px;font-size:11px;color:#b3c3cf;line-height:1.35}
.brief-mast__stamp{min-width:124px;padding-left:13px;border-left:1px solid #465562;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.brief-mast__stamp span{font-size:9px;font-weight:850;letter-spacing:.1em;color:#90a5b6}
.brief-mast__stamp strong{color:var(--light);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.brief-leader-group+.brief-leader-group{margin-top:15px}
.brief-leader-category{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:19px;margin:0 2px 8px}
.brief-leader-category h3{font-size:10px;letter-spacing:.13em;font-weight:900;color:#f3c17f;line-height:1.3}
.brief-leader-category span{font-size:9px;letter-spacing:.095em;color:#829aad;font-weight:800;text-align:right}
.brief-leader-group--smg .brief-leader-category h3{color:#acd2e1}
.brief-leaders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.leader-card{position:relative;display:flex;flex-direction:column;min-width:0;min-height:146px;padding:14px 15px 12px;text-align:left;overflow:hidden;border:1px solid #334b5e;border-radius:13px;background:radial-gradient(circle at 108% -15%,#d8973718,transparent 54%),linear-gradient(142deg,#182d3b,#111d2b 81%);box-shadow:0 7px 17px #0002;transition:border-color .16s,transform .16s,background .16s}
.leader-card::before{position:absolute;content:"";height:2px;top:0;left:0;right:0;background:linear-gradient(90deg,#f4af51,transparent 85%)}
.leader-card--wz{background:radial-gradient(circle at 108% -15%,#73b2c91e,transparent 54%),linear-gradient(142deg,#142b39,#111d2b 81%)}
.leader-card--wz::before{background:linear-gradient(90deg,#87b6c9,transparent 85%)}
.leader-card:hover{border-color:#6a7c8b;transform:translateY(-1px)}
.leader-card__source{font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#e7ba78}
.leader-card--wz .leader-card__source{color:#a6d1e2}
.leader-card__index{color:#869bad;font-size:9px;font-weight:800;letter-spacing:.07em;text-align:right}
.leader-card__weapon{overflow-wrap:break-word;font-size:clamp(21px,4vw,28px);letter-spacing:-.045em;line-height:1.02;font-weight:950;margin:13px 0 4px;color:#f5f7fa}
.leader-card__description{font-size:11px;color:#bdcad4;line-height:1.35}
.leader-card__bottom{margin-top:auto;padding-top:13px;font-size:10px;color:#839bad;line-height:1.3}
.leader-card__action{font-size:9px;color:var(--light);letter-spacing:.07em;font-weight:900;white-space:nowrap}
.leader-card__action span{font-size:14px;margin-left:3px}
.brief-explain{margin:8px 2px 14px;color:#90a3b3;font-size:11px;line-height:1.4}
.intel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.intel-signal{position:relative;display:flex;flex-direction:column;min-width:0;min-height:122px;padding:13px 14px;text-align:left;border:1px solid #304356;border-radius:12px;background:linear-gradient(145deg,#142433,#111b28);transition:border-color .16s,transform .16s}
.intel-signal:hover{border-color:#637a8a;transform:translateY(-1px)}
.intel-signal--patch{grid-column:1/-1;min-height:105px;border-color:#695539;background:linear-gradient(118deg,#1d2b35,#17212c 69%,#2a251d)}
.intel-signal--patch::before{position:absolute;content:"";top:14px;bottom:14px;left:0;width:2px;background:#efad52}
.intel-signal__eyebrow{display:flex;align-items:center;gap:7px;color:#a6b7c7;font-size:9px;font-weight:900;letter-spacing:.13em}
.intel-signal__num{color:var(--amber);font-variant-numeric:tabular-nums}
.intel-signal__title{font-size:clamp(15px,2.8vw,18px);color:#eef3f6;line-height:1.18;letter-spacing:-.025em;font-weight:880;margin:12px 0 10px}
.intel-signal--patch .intel-signal__title{margin:10px 0 9px}
.intel-signal__bottom{margin-top:auto;font-size:10px;color:#9cadbc;line-height:1.3}
.intel-signal__action{font-size:10px;color:var(--light);font-weight:900;white-space:nowrap;letter-spacing:.035em}
.intel-signal__action span{font-size:14px}
.brief-provenance{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;margin:13px 2px 3px;font-size:10px;color:#91a4b4}
.brief-provenance .source-link{font-size:10px;min-height:22px}
@media(min-width:620px){
 .brief-mast{padding:18px 22px 20px}
 .brief-mast__body{margin-top:15px}
 .leader-card{min-height:156px;padding:17px 19px 14px}
 .intel-grid{grid-template-columns:1.3fr 1fr 1fr}

}
@media(max-width:399px){

 .brief-mast__stamp{min-width:96px;padding-left:8px}
 .brief-mast__stamp strong{font-size:10px}
 .brief-mast h1{font-size:21px}
 .brief-mast__identity p{font-size:10px}
 .leader-card{padding:12px 11px 11px;min-height:144px}
 .brief-leader-category h3{font-size:9px}
 .brief-leader-category span{font-size:8px}
 .leader-card__source,.leader-card__index{font-size:8px}
 .leader-card__weapon{font-size:22px}
 .leader-card__bottom{font-size:9px;flex-wrap:wrap;gap:4px}
 .leader-card__action{font-size:8px}
 .intel-signal{padding:12px 11px}
